<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg: #f6f7fb;
            --panel: rgba(255, 255, 255, 0.88);
            --card: rgba(255, 255, 255, 0.76);
            --line: rgba(31, 41, 55, 0.10);
            --text-main: #172033;
            --text-soft: #526071;
            --text-muted: #8a94a3;
            --accent: #2f7dd1;
            --accent-soft: #e6f0fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 850px;
            min-height: 100vh;
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: var(--text-main);
            background:
                linear-gradient(135deg, rgba(47, 125, 209, 0.10), rgba(80, 184, 163, 0.08)),
                var(--bg);
            -webkit-font-smoothing: antialiased;
        }

        .page {
            width: 850px;
            padding: 42px 46px;
        }

        .shell {
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: var(--panel);
            box-shadow: 0 24px 70px rgba(36, 48, 70, 0.14);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .header {
            position: relative;
            padding: 34px 38px 28px;
            border-bottom: 1px solid var(--line);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.92), rgba(244, 248, 253, 0.74));
        }

        .eyebrow {
            margin-bottom: 10px;
            color: var(--accent);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0;
        }

        h1 {
            margin: 0;
            font-size: 36px;
            line-height: 1.18;
            letter-spacing: 0;
        }

        .summary {
            margin-top: 10px;
            color: var(--text-soft);
            font-size: 14px;
            line-height: 1.7;
        }

        .count {
            position: absolute;
            top: 34px;
            right: 38px;
            min-width: 76px;
            padding: 10px 14px;
            border: 1px solid rgba(47, 125, 209, 0.20);
            border-radius: 16px;
            background: var(--accent-soft);
            color: var(--text-main);
            text-align: center;
        }

        .count-number {
            display: block;
            font-size: 24px;
            font-weight: 800;
            line-height: 1;
        }

        .count-label {
            display: block;
            margin-top: 4px;
            color: var(--text-muted);
            font-size: 11px;
        }

        .content {
            padding: 24px 26px 26px;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .plugin {
            min-height: 74px;
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 15px 18px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--card);
            box-shadow: 0 10px 24px rgba(36, 48, 70, 0.07);
        }

        .plugin-index {
            flex: 0 0 auto;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 11px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 13px;
            font-weight: 800;
        }

        .plugin-body {
            min-width: 0;
            flex: 1;
        }

        .plugin-name {
            margin: 0;
            color: var(--text-main);
            font-size: 20px;
            font-weight: 800;
            line-height: 1.35;
            letter-spacing: 0;
        }

        .plugin-desc {
            margin: 7px 0 0;
            color: var(--text-soft);
            font-size: 14px;
            line-height: 1.55;
            word-break: break-word;
        }

        .footer {
            padding: 17px 38px 22px;
            border-top: 1px solid var(--line);
            color: var(--text-muted);
            font-size: 11px;
            line-height: 1.6;
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="shell">
            <header class="header">
                <div class="eyebrow">BOT COMMAND CENTER</div>
                <h1>功能菜单</h1>
                <div class="summary">输入 help 插件名 查看详细用法。</div>
                <div class="count">
                    <span class="count-number">{{ plugins | length }}</span>
                    <span class="count-label">plugins</span>
                </div>
            </header>

            <div class="content">
                <div class="list">
                    {% for item in plugins %}
                    <article class="plugin">
                        <div class="plugin-index">{{ loop.index }}</div>
                        <div class="plugin-body">
                            <h2 class="plugin-name">{{ item.name }}</h2>
                            <p class="plugin-desc">{{ item.description }}</p>
                        </div>
                    </article>
                    {% endfor %}
                </div>
            </div>

            <footer class="footer">
                Design by xqcherry · 2026
            </footer>
        </section>
    </main>
</body>
</html>
