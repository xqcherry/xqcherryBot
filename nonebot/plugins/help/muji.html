<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-panel: rgba(15, 23, 42, 0.72);
            --bg-card: rgba(255, 255, 255, 0.10);
            --line: rgba(255, 255, 255, 0.16);
            --text-main: #f8fafc;
            --text-soft: rgba(226, 232, 240, 0.78);
            --text-muted: rgba(203, 213, 225, 0.62);
            --accent: #5eead4;
            --accent-soft: rgba(94, 234, 212, 0.16);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 850px;
            min-height: 100vh;
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: var(--text-main);
            background: linear-gradient(145deg, #08111f 0%, #101827 46%, #173342 100%);
            -webkit-font-smoothing: antialiased;
        }

        .page {
            width: 850px;
            padding: 46px 48px;
        }

        .shell {
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: var(--bg-panel);
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }

        .header {
            position: relative;
            padding: 34px 38px 28px;
            border-bottom: 1px solid var(--line);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.035));
        }

        .eyebrow {
            margin-bottom: 10px;
            color: var(--accent);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0;
        }

        h1 {
            margin: 0;
            font-size: 36px;
            line-height: 1.18;
            letter-spacing: 0;
        }

        .summary {
            margin-top: 10px;
            color: var(--text-soft);
            font-size: 14px;
            line-height: 1.7;
        }

        .count {
            position: absolute;
            top: 34px;
            right: 38px;
            min-width: 76px;
            padding: 10px 14px;
            border: 1px solid rgba(94, 234, 212, 0.32);
            border-radius: 18px;
            background: rgba(8, 17, 31, 0.34);
            color: var(--text-main);
            text-align: center;
        }

        .count-number {
            display: block;
            font-size: 24px;
            font-weight: 800;
            line-height: 1;
        }

        .count-label {
            display: block;
            margin-top: 4px;
            color: var(--text-muted);
            font-size: 11px;
        }

        .content {
            padding: 26px;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .plugin {
            min-height: 76px;
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 16px 18px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: linear-gradient(145deg, var(--bg-card), rgba(255, 255, 255, 0.052));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.09);
        }

        .plugin-index {
            flex: 0 0 auto;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 13px;
            font-weight: 800;
        }

        .plugin-body {
            min-width: 0;
            flex: 1;
        }

        .plugin-name {
            margin: 0;
            color: var(--text-main);
            font-size: 20px;
            font-weight: 800;
            line-height: 1.35;
            letter-spacing: 0;
        }

        .plugin-desc {
            margin: 8px 0 0;
            color: var(--text-soft);
            font-size: 14px;
            line-height: 1.55;
            word-break: break-word;
        }

        .footer {
            padding: 18px 38px 24px;
            border-top: 1px solid var(--line);
            color: var(--text-muted);
            font-size: 11px;
            line-height: 1.6;
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="shell">
            <header class="header">
                <div class="eyebrow">BOT COMMAND CENTER</div>
                <h1>功能菜单</h1>
                <div class="summary">输入 help 插件名 查看详细用法。</div>
                <div class="count">
                    <span class="count-number">{{ plugins | length }}</span>
                    <span class="count-label">plugins</span>
                </div>
            </header>

            <div class="content">
                <div class="list">
                    {% for item in plugins %}
                    <article class="plugin">
                        <div class="plugin-index">{{ loop.index }}</div>
                        <div class="plugin-body">
                            <h2 class="plugin-name">{{ item.name }}</h2>
                            <p class="plugin-desc">{{ item.description }}</p>
                        </div>
                    </article>
                    {% endfor %}
                </div>
            </div>

            <footer class="footer">
                Design by xqcherry · 2026
            </footer>
        </section>
    </main>
</body>
</html>
